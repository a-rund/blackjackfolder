
<!-- This is the Main Game (blackjack) Web Page -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styleofgame.css">
</head>

<body>

    <h1>Blackjack</h1>
    
    
    
    <div class="game-container">
        <div id="popup">
            <div id="bankAccount"> Your Bank Account Balance is: 250,000$</div>
            <div> How much money do you wanna put in?</div>
            <br>
                 <div id="moneyBox">
                    <label>Money $</label>
                    <input type="number" id="startingMoney" required min="1">
                    
                 </div>
                 <div id="buttonBox">
                    <button id="startButton">Start!</button>
                </div>
        </div>

        <div id="deckofcards"></div>

        <div id="money"> <span id="counter">-</span></div>
        <div id="dealer_area">
        <div id="dealer-hand" class="hand"> </div>
        </div>
        <div id="dScore"><span>Dealers Score:</span><span id="dealer-score">0</span></div>
        <div id="message"> </div>

        
        <div id="player-area">
            <div id="score"><span>Player Score:</span><span id="player-score">0</span></div>
            <div id="player-hand" class="hand"></div>
           
        </div>
        <div id="buttons">
            <button id="hit" class="gamebuttons">Hit</button>
            <button id="stand" class="gamebuttons">Stand</button>
            <button id="reset" class="gamebuttons">Reset</button>
        </div>
       
    </div>
    <audio controls autoplay loop hidden>
        <source src="piano-jazz-303730.mp4" type="audio/mpeg">
    </audio>
    <script type="module" src="gamegame.js"></script>
    <script type="module" src="moneyFunc.js"></script>

</body>

</html>
