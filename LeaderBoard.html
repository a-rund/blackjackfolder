<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Leaderboard</title>
    <link rel="stylesheet" href="LeaderBoardStyle.css">
</head>
<body>
    <div class="container">
        <h1>Leaderboard</h1>

        <div class="input-section">
            <input type="text" id="player-name" placeholder="Enter Player Name">
            <input type="number" id="player-score" placeholder="Enter Score">
            <button id="add-score">Add</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard entries will be added here dynamically -->
            </tbody>
        </table>
    </div>

    <script src="LeaderBoardFunction.js"></script>
</body>
</html>
