<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="LoginStyle.css">
</head>

<body>
    <div id="outerBox">
        <form action="index.js" method="post" id="formbox">
            <label for="username">Username:</label>
            <input type="text" id="username" minlength="4" maxlength="15" required>

            <br>

            <label for="password"> Password:</label>
            <input type="password" id="password" minlength="4" maxlength="15" required>
            <br>
            <label for="email"> Email:</label>
            <input type="email" id="email" required>
            <br>



            <label for="experince"> Experince</label>
            <select id="experince">
                <option value="bad">Bad</option>
                <option value="decent">Decent</option>
                <option value="good">Good</option>
                <option value="excellent">Excellent</option>
            </select><br>
    
    <input type="reset">
    <br>
    <input type="submit">
    </form>
</div>
</body>
